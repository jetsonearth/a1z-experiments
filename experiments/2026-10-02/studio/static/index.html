<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1Z 控制台</title><meta name="csrf-token" content="__TOKEN__"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><header><a class="brand" href="/">A1Z <span class="muted">/ 控制台</span></a><div class="header-right"><span class="mono device"><i id="connectionDot"></i><span id="connectionText">JETSON · 未连接</span></span><button id="theme" class="icon-button" aria-label="切换浅色模式" title="切换明暗">◐</button></div></header>
<main><section class="capture-bar" aria-label="采集控制"><div class="capture-actions"><button id="connect" class="secondary">连接</button><button id="start" class="primary" disabled><span class="record-icon"></span><span id="startLabel">开始采集</span></button><button id="stop" class="stop" hidden>停止并保存</button></div><span class="mono" id="stateLabel">[ IDLE ]</span><span class="mono muted" id="liveCounter">— FRAMES</span><p id="statusMessage" class="small muted" aria-live="polite">读取状态…</p></section>
<div class="workspace"><section class="viewer"><div class="section-heading"><span>相机</span><span class="small muted" id="cameraSource">选择录制记录查看视频</span></div><div class="camera-pane"><video id="episodeVideo" controls preload="metadata" playsinline hidden aria-label="当前录制视频"></video><div id="cameraPlaceholder" class="camera-placeholder"><span>D405</span><span class="small muted">此条轨迹没有可回放的视频。</span></div></div><details id="cameraTestSection" hidden><summary>相机测试录像 · 非实时 · 与下方轨迹无关</summary><video id="cameraTest" controls preload="metadata" playsinline aria-label="D405 独立相机测试录像"></video></details>
<div class="player"><div class="player-top"><span id="episodeTitle">加载记录…</span><span class="mono" id="recordBadge">原始记录</span></div><p id="datasetStatus" class="small muted" hidden></p><div class="transport"><button id="play" class="play-button" aria-label="播放轨迹" disabled>▷</button><span class="mono time" id="playTime">00:00.0 / 00:00.0</span><input id="timeline" type="range" min="0" max="10000" value="0" aria-label="回放时间轴" disabled><button id="speed" class="speed mono" aria-label="切换播放速度">1×</button></div></div>
<details class="joint-details"><summary>关节数据 <span class="small muted">仅回看，不驱动机械臂</span></summary><div class="pose-view"><canvas id="pose" aria-label="机械臂关节姿态回放"></canvas><div class="pose-label"><span class="small muted">关节姿态示意</span></div><div class="video-empty"><span>此条轨迹未采集视频</span></div></div><div class="data-summary"><span id="duration">— SEC</span><span id="sampleCount">— FRAMES</span><span id="sampleRate">— HZ</span><a id="download" class="text-button" download>导出 JSON</a></div><div class="section-heading chart-heading"><span class="eyebrow">关节角度 / DEG</span><div id="jointTabs" class="joint-tabs" role="group" aria-label="选择关节"></div></div><canvas id="chart" aria-label="关节角度曲线"></canvas><div id="jointReadings" class="joint-readings"></div>
</details></section><aside><div class="section-heading"><span>录制记录 <span id="libraryCount" class="mono muted">00</span></span><button id="sync" class="text-button small">同步</button></div><div id="library" class="library"><p class="muted">加载中…</p></div><details class="diagnostics"><summary>运行日志</summary><pre id="logs">尚无运行记录</pre></details></aside></div></main></div><script src="/app.js"></script></body></html>
